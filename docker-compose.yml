services:
  backend: &backend
    image: doc_manager:dev
    #build:
     # context: .
      #dockerfile: Dockerfile
#    container_name: django-backend
#    command: bash -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 DocumentationBot.asgi:application  -k uvicorn.workers.UvicornWorker -w 2 --log-level info"
    command: bash -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 DocManager.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - docker.env
    depends_on:
      - db
      - redis
    networks:
      - DocManager

  db:
    image: postgres:17.4-alpine3.21
    container_name: postgres-db-dev
    volumes:
      - postgres_data:/var/lib/postgres/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - DocManager

  redis:
    image: redis:latest
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - REDIS_DATA:/data
    networks:
      - DocManager

volumes:
  postgres_data:
    name: postgres_data_dev
    driver: local
  POSTGRES_CONFIG:
    name: POSTGRES_CONFIG
    driver: local
  REDIS_DATA:
    name: REDIS_DATA_1
    driver: local
  REDIS_CONFIG:
    name: REDIS_CONFIG
    driver: local

networks:
  DocManager:
    name: DocManager
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: DocManager
